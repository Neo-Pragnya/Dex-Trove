# Dex Trove source map — what we learn from, and how (DESIGN.md §12).
# Order matters: earlier sources win duplicate content.
# Licences are re-verified on every `dex learn`, item by item, from licence *text*; `license:` here only
# records expectations (and, for first-party sources we own, the default).

sources:
  - id: neo-pragnya
    title: Neo Pragnya (first-party)
    description: >-
      Skills developed in-house: architecture-as-code with animated SVG diagrams, Astro documentation sites,
      interactive web motion, living diagrams, capability acceptance testing, package security scanning, a
      life Ikigai architect, idea development, technology selection, research questionnaires, scaffold
      harvesting and token-saving repository context. Personal skills in the same folder are hidden by the
      folder's own .dexignore (never named in this repo).
    adapter: agent-skills
    local: ../Skills
    homepage: https://github.com/Neo-Pragnya/Dex-Trove
    license: { first_party: true, default: MIT }
    # AWS Architecture Icons may be used in diagrams but not redistributed as an icon set.
    # The skill fetches them on demand with scripts/fetch_icons.py (from the MIT `diagrams` wheel).
    exclude:
      - "marvellous-aws-architecture-docs/assets/icons/*.png"
      - "*/assets/previews/*"
      - "ikigai/*"
      - "site/*"
    items:
      marvellous-aws-architecture-docs:
        inspired_by:
          - { title: AWS Reference Architecture Diagrams, url: "https://aws.amazon.com/architecture/reference-architecture-diagrams/" }
          - { title: "mingrammer/diagrams (MIT)", url: "https://github.com/mingrammer/diagrams" }
      astro-docs-site:
        inspired_by:
          - { title: "Astro content collections", url: "https://docs.astro.build/en/guides/content-collections/" }
          - { title: "github/awesome-copilot website (Astro)", url: "https://github.com/github/awesome-copilot/tree/main/website" }
          - { title: "Material for MkDocs (the docs experience it replaces)", url: "https://squidfunk.github.io/mkdocs-material/" }
      interactive-web-motion:
        inspired_by:
          - { title: "graphify.com — dashed marching borders, reveals, grain", url: "https://graphify.com/" }
          - { title: "Particle text effects (canvas pixel sampling)", url: "https://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D/getImageData" }
          - { title: "Polar shape morphing (radius-function interpolation)", url: "https://en.wikipedia.org/wiki/Polar_coordinate_system" }
      living-diagrams:
        inspired_by:
          - { title: "Ananke Plexus logo and infographics (the cosmic harness)", url: "https://github.com/Neo-Pragnya/Ananke-Plexus/tree/main/docs/assets" }
          - { title: "Plexus / constellation network visuals", url: "https://en.wikipedia.org/wiki/Plexus" }
          - { title: "Mermaid (MIT), the diagrams it brings to life", url: "https://github.com/mermaid-js/mermaid" }
      repo-context:
        inspired_by:
          - { title: "Serena (GPL-3.0-or-later; run as its own server, not included)", url: "https://github.com/oraios/serena" }
          - { title: "python-repomix (MIT)", url: "https://github.com/AndersonBY/python-repomix" }
          - { title: "Graphify (Apache-2.0)", url: "https://github.com/Graphify-Labs/graphify" }
      capability-acceptance:
        inspired_by:
          - { title: "WWI Data Science Agent course, Week 12 — agent evaluation and release gate", url: "https://github.com/Neo-Pragnya/Dex-Trove/blob/main/acceptance/README.md" }
          - { title: "pytest-bdd (MIT) — Gherkin scenarios on pytest", url: "https://github.com/pytest-dev/pytest-bdd" }
          - { title: "Chrome DevTools Protocol", url: "https://chromedevtools.github.io/devtools-protocol/" }
      life-ikigai-architect:
        inspired_by:
          - { title: "Ikigai (Héctor García & Francesc Miralles)", url: "https://en.wikipedia.org/wiki/Ikigai" }

  - id: awesome-copilot
    title: Awesome GitHub Copilot
    description: Community collection of Copilot agents, instructions, skills, hooks, agentic workflows and plugins.
    adapter: awesome-copilot
    repo: https://github.com/github/awesome-copilot
    ref: main
    local: ../awesome-copilot
    license: { expected: MIT }
    items:
      eval-driven-dev: { withhold: "installed pixie-qa unpinned; use skill:patched/eval-driven-dev" }

  - id: anthropic
    title: Anthropic Agent Skills
    description: >-
      Anthropic's public skills repo. No repo-level licence: example skills are Apache-2.0 per item; the
      document skills (docx, pdf, pptx, xlsx) are proprietary and are excluded.
    adapter: agent-skills
    repo: https://github.com/anthropics/skills
    ref: main
    options: { roots: [skills] }
    license: { expected: per-item }
    items:
      claude-api: { withhold: "a script printed values derived from credentials; use skill:patched/claude-api" }
      web-artifacts-builder: { withhold: "installed pnpm unpinned; use skill:patched/web-artifacts-builder" }

  - id: superpowers
    title: Superpowers (obra)
    description: Engineering-workflow skills for coding agents — TDD, systematic debugging, planning, code review.
    adapter: agent-skills
    repo: https://github.com/obra/superpowers
    ref: main
    options: { roots: [skills] }
    license: { expected: MIT }

  - id: huggingface
    title: Hugging Face Skills
    adapter: agent-skills
    repo: https://github.com/huggingface/skills
    ref: main
    items:
      hf-cloud-sagemaker-iam-preflight: { withhold: "its trust check can pass a role SageMaker can't assume; use skill:patched/hf-cloud-sagemaker-iam-preflight" }
    license: { expected: Apache-2.0 }

  - id: microsoft
    title: Microsoft Skills
    adapter: agent-skills
    repo: https://github.com/microsoft/skills
    ref: main
    options: { roots: [.github/plugins] }
    items:
      azure-kubernetes: { withhold: "its Dockerfile templates use unpinned base images; use skill:patched/azure-kubernetes" }
      azure-cosmos-db-py: { withhold: "placeholder credentials in its examples trip package scanners" }
      azure-security-keyvault-secrets-java: { withhold: "placeholder credentials in its examples trip package scanners" }
    license: { expected: MIT }

  - id: bmad-method
    title: BMAD Method (unofficial copy)
    description: >-
      Agile delivery skills from the BMAD Method: analysis, product briefs, PRDs, architecture, UX, reviews and
      retrospectives. Redistributed under its MIT licence. Dex Trove isn't affiliated with or endorsed by BMad Code, LLC,
      which owns the BMad names and marks; see the upstream TRADEMARK.md.
      Its core `bmad` skill is a patched fork: use skill:patched/bmad.
    adapter: agent-skills
    repo: https://github.com/bmad-code-org/BMAD-METHOD
    ref: main
    options: { roots: [skills] }
    license: { expected: MIT }
    items:
      bmad: { withhold: "a version pattern can stall on crafted input; use skill:patched/bmad" }

  - id: impeccable
    title: Impeccable
    description: >-
      Frontend design skill and reference library from pbakaus/impeccable. Its launcher runs a platform binary that isn't
      in the skill: on first use it downloads one from upstream and checks it against the bundled checksums. Set
      IMPECCABLE_BIN to use a binary you installed yourself.
    adapter: agent-skills
    repo: https://github.com/pbakaus/impeccable
    ref: main
    options: { roots: [plugin/skills] }
    license: { expected: Apache-2.0 }

  - id: spec-kit
    title: Spec Kit
    description: >-
      Spec-driven development commands from github/spec-kit. They expect the scripts and templates that
      `specify init` puts in `.specify/`, so set a project up with Spec Kit first.
    adapter: md-agents
    repo: https://github.com/github/spec-kit
    ref: main
    options: { kind: prompt, globs: ["templates/commands/*.md"] }
    license: { expected: MIT }

  - id: scientific
    title: Scientific skills (K-Dense)
    adapter: agent-skills
    repo: https://github.com/K-Dense-AI/claude-scientific-skills
    ref: main
    items:
      protocolsio-integration: { withhold: "use skill:patched/protocolsio-integration, with a clearer address check" }
      database-lookup: { withhold: "placeholder credentials in its examples trip package scanners" }
    license: { expected: MIT }

  - id: wshobson
    title: Agents and plugins (wshobson)
    adapter: md-agents
    repo: https://github.com/wshobson/agents
    ref: main
    options: { globs: ["plugins/*/agents/*.md"] }
    license: { expected: MIT }

  - id: voltagent
    title: Claude Code subagents (VoltAgent)
    adapter: md-agents
    repo: https://github.com/VoltAgent/awesome-claude-code-subagents
    ref: main
    items:
      healthcare-admin: { withhold: "tells the agent to pipe a third-party install script into bash" }
    options: { globs: ["categories/*/*.md"] }
    license: { expected: MIT }

  - id: claude-plugins
    title: Official Claude Code plugins
    adapter: agent-skills
    repo: https://github.com/anthropics/claude-plugins-official
    ref: main
    options: { roots: [plugins] }
    license: { expected: Apache-2.0 }

  - id: patched
    title: Patched forks
    description: >-
      Upstream items with a security fix, recorded as forks. Each keeps its upstream licence and says what changed in
      CHANGES.md, and the original is left out of the trove. Lives in forks/ in this repository.
    adapter: agent-skills
    local: forks
    homepage: https://github.com/Neo-Pragnya/Dex-Trove/tree/main/forks
    license: { expected: per-item }
    items:
      hf-cloud-sagemaker-iam-preflight:
        forked_from: skill:huggingface/hf-cloud-sagemaker-iam-preflight
      claude-api:
        forked_from: skill:anthropic/claude-api
      bmad:
        forked_from: skill:bmad-method/bmad
      protocolsio-integration:
        forked_from: skill:scientific/protocolsio-integration
      azure-kubernetes:
        forked_from: skill:microsoft/azure-kubernetes
      eval-driven-dev:
        forked_from: skill:awesome-copilot/eval-driven-dev
      web-artifacts-builder:
        forked_from: skill:anthropic/web-artifacts-builder


# What the trove offers for each planned capability, and what's missing. Curated; a sidecar like relations.yaml.
#
# Reuse comes first: an existing item is pinned and composed, a small gap gets a sidecar or a wrapper skill, and a new
# skill is the last resort.
#   status:      available (usable for the job today) | partial (useful, doesn't cover the job) | missing (nothing fits)
#   enhancement: reuse | sidecar | wrapper | workflow | new | feature (built into Dex itself, not a skill)
#   assessed:    description (fit judged from the item's own text) | tests (behaviour checked by automated tests)
#                No golden-task evaluation has been run for any `description` entry.
#   ananke:      the Ananke operation that does the computing, or "not built"

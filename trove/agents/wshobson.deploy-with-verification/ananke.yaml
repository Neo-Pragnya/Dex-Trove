kind: agent
namespace: wshobson
name: deploy-with-verification
version: 1.0.0
ananke_id: urn:dex-trove:agent:wshobson:deploy-with-verification
summary: Use when deploying to production. Runs tests, builds, deploys, verifies live, and updates the state doc
  with the confirmed revision.
description: Use when deploying to production. Runs tests, builds, deploys, verifies live, and updates the state

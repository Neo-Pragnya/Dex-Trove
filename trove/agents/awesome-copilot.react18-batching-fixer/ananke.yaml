kind: agent
namespace: awesome-copilot
name: react18-batching-fixer
version: 1.0.0
ananke_id: urn:dex-trove:agent:awesome-copilot:react18-batching-fixer
summary: Automatic batching regression specialist. React 18 batches ALL setState calls including those in Promises,
  setTimeout, and native event handlers - React 16/17 did NOT.
description: Automatic batching regression specialist. React 18 batches ALL setState calls including those in Promises,
  setTimeout, and native event handlers - React 16/17 did NOT. Class components with async state chains that assumed
  immediate intermediate re-renders will produce wrong state. This agent finds every vulnerable pattern and fixes
  with flushSync where semantically required.

kind: agent
namespace: awesome-copilot
name: prompt-engineer
version: 1.0.0
ananke_id: urn:dex-trove:agent:awesome-copilot:prompt-engineer
summary: A specialized chat mode for analyzing and improving prompts. Every user input is treated as a prompt to
  be improved.
description: A specialized chat mode for analyzing and improving prompts. Every user input is treated as a prompt
  to be improved. It first provides a detailed analysis of the original prompt within a <reasoning> tag, evaluating
  it against a systematic framework based on OpenAI's prompt engineering best practices. Following the analysis,
  it generates a new, improved prompt.

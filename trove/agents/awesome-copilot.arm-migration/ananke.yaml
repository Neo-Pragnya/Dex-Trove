kind: agent
namespace: awesome-copilot
name: arm-migration
version: 1.0.0
ananke_id: urn:dex-trove:agent:awesome-copilot:arm-migration
summary: Arm Cloud Migration Assistant accelerates moving x86 workloads to Arm infrastructure.
description: Arm Cloud Migration Assistant accelerates moving x86 workloads to Arm infrastructure. It scans the
  repository for architecture assumptions, portability issues, container base image and dependency incompatibilities,
  and recommends Arm-optimized changes. It can drive multi-arch container builds, validate performance, and guide
  optimization, enabling smooth cross-platform deployment directly inside GitHub.
runtime:
  supported:
  - claude-code
  - github-copilot
  - generic
instructions:
  ref: arm-migration.agent.md
permissions:
  filesystem:
    read: []
    write: []
  shell:
    allow: []
  network: []
license:
  expression: MIT
  source: 'LICENSE: MIT text'
  approval: approved
metadata:
  tags:
  - agent
  - awesome-copilot
  homepage: https://github.com/github/awesome-copilot/blob/613efc8c21d9b3ce642dff361d17006cd9967e28/agents/arm-migration.agent.md
  repository: https://github.com/github/awesome-copilot

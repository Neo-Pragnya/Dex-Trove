summary: Pick the right serving container for a SageMaker model deployment and find its current image URI.
description: 'Pick the right serving container for a SageMaker model deployment and find its current image URI.
  Use this skill whenever about to deploy a model to a SageMaker endpoint and an image URI needs to be chosen —
  including when the user says "deploy this LLM", "host this HuggingFace model", "serve this fine-tuned model",
  "deploy this embedding model", "host a reranker", "serve a sentence-transformers model", or when about to hardcode
  any container URI in deployment code. HuggingFace-curated Deep Learning Containers are ALWAYS preferred: HuggingFace
  vLLM (LLMs and generative rerankers), HuggingFace vLLM-Omni (multimodal), TEI (embeddings/cross-encoder rerankers),
  HF Inference Toolkit (other transformers). Generic images (AWS vLLM, DJL-LMI, SGLang) are used only when no HuggingFace
  image is compatible — never merely because they carry a newer version. Never hardcode a container URI from memory
  and never default to TGI. Prevents stale-image failures and wrong-region URIs.'

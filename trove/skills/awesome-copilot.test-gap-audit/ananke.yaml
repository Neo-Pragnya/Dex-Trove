summary: Run a read-only audit for missing, weak, stale, or mis-scoped test coverage. If the user does not name
  a scope, audit the full repository and identify important code paths, routes, features, services,…
description: Run a read-only audit for missing, weak, stale, or mis-scoped test coverage. If the user does not name
  a scope, audit the full repository and identify important code paths, routes, features, services, workflows, and
  contracts that lack proper tests. If the user names a feature, PR, branch, route, workflow, service, bug fix,
  API, security-sensitive path, or risky code change, focus only on that specific scope. Use when the user asks
  what tests are missing, whether coverage is enough, what regression tests to add, or how to prove a change is
  safe. This is not a general bug audit and not a security review; it evaluates whether behavior is covered by tests.

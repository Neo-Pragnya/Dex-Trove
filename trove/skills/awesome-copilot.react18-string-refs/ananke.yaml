summary: Provides exact migration patterns for React string refs (ref="name" + this.refs.name) to React.createRef()
  in class components.
description: Provides exact migration patterns for React string refs (ref="name" + this.refs.name) to React.createRef()
  in class components. Use this skill whenever migrating string ref usage - including single element refs, multiple
  refs in a component, refs in lists, callback refs, and refs passed to child components. Always use this skill
  before writing any ref migration code - the multiple-refs-in-list pattern is particularly tricky and this skill
  prevents the most common mistakes. Use it for React 18.3.1 migration (string refs warn) and React 19 migration
  (string refs removed).

description: Designs and audits PCR and RT-qPCR primers with Primer3, explicit thermodynamic conditions, reference-based
  off-target amplification searches, and traceable sequence coordinates. Use for designing primer pairs, checking
  existing primers, exon-junction or isoform-specific assays, variant masking, cloning tails, multiplex compatibility,
  and interpreting Primer-BLAST results. Includes bounded local in-silico PCR and BLAST screening; distinguishes
  computational candidates from experimentally validated assays.

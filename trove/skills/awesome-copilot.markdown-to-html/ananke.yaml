description: Convert Markdown files to HTML similar to `marked.js`, `pandoc`, `gomarkdown/markdown`, or similar
  tools; or writing custom script to convert markdown to html and/or working on web template systems like `jekyll/jekyll`,
  `gohugoio/hugo`, or similar web templating systems that utilize markdown documents, converting them to html. Use
  when asked to "convert markdown to html", "transform md to html", "render markdown", "generate html from markdown",
  or when working with .md files and/or web a templating system that converts markdown to HTML output. Supports
  CLI and Node.js workflows with GFM, CommonMark, and standard Markdown flavors.

name: paper-lookup
version: 1.0.0
ananke_id: urn:dex-trove:skill:scientific:paper-lookup
summary: Searches 18 scholarly APIs for papers, preprints, citations, open-access full text, repository records,
  and journal OA status, and returns results with reproducible provenance.
description: Searches 18 scholarly APIs for papers, preprints, citations, open-access full text, repository records,
  and journal OA status, and returns results with reproducible provenance. Covers PubMed, PMC, Europe PMC, bioRxiv,
  medRxiv, arXiv, OpenAlex, Crossref, Semantic Scholar, CORE, Unpaywall, OpenCitations, PubTator3, Zenodo, Figshare,
  ROR, BioStudies, and DOAJ. Use when searching for papers, citations, DOI/PMID/arXiv lookups, abstracts, full text,
  open-access PDFs, preprints, citation graphs, author publications, biomedical entity annotations, deposited records
  (Zenodo, Figshare, BioStudies), institution ROR IDs, or any scholarly literature query. Triggers on mentions of
  any supported database or requests like "find papers on X", "look up this DOI", "who cites this paper", or "get
  me the PDF".

description: Creates, edits and embeds dotted world maps and animated 3D globes with Globestudio (globestudio.app),
  a free open source studio with 21 looks. Use when the user wants a dotted map, a dotted or 3D globe, a spinning
  earth or a stylized world map for a website hero, background, slide, social post or video; when they paste a globestudio.app
  link or a ?c= config; or when code uses @globestudio/react, @globestudio/element, the globe-studio web component
  or globestudio.app/embed. Also use it to highlight a country, continent or region, plot points and arcs, match
  brand colors, or prepare PNG, SVG, GLB, MP4, WebM or GIF exports. Not for interactive tiled maps, routing, geocoding
  or GIS analysis (Mapbox, MapLibre, deck.gl), or for ordinary charts.

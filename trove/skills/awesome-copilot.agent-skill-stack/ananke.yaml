description: Find, evaluate, and assemble the smallest compatible set of AI Agent Skills for an end-to-end natural-language
  goal. Use when a user wants Skills for a multi-step workflow, asks which Skills fit a project, needs an installed-Skill
  audit or conflict check, has low Skill recall, wants indirect helpers such as humanizers or compliance checks,
  or wants a project-specific Skill Stack with controlled installation. Search local Skills, registries, GitHub,
  and OpenCLI; compare adoption, verified fit, safety, and overlap. Do not use for locating one known or common
  Skill; use the generic find-skills workflow.

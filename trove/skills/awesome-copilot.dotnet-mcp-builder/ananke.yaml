summary: Build Model Context Protocol (MCP) servers in C#/.NET against the current ModelContextProtocol 2.x NuGet
  packages.
description: 'Build Model Context Protocol (MCP) servers in C#/.NET against the current ModelContextProtocol 2.x
  NuGet packages. Helps with cases the model gets wrong without guidance — stale versions (0.x preview or 1.x-era
  defaults), the v2 stateless-by-default HTTP flip, the 2026-07-28 spec deprecations (roots/sampling/logging), MCP
  Apps and Tasks extension packages, elicitation URL mode, per-session HTTP wiring, OAuth and reverse-proxy deploy
  specifics, and debugging MapMcp / STDIO / Streamable-HTTP errors. Also covers STDIO and Streamable HTTP transports
  (SSE is deprecated), tools, prompts, resources, completions, and a basic .NET MCP client. Trigger when the user
  says or implies any .NET MCP server work: ModelContextProtocol, McpServerTool, MapMcp, WithStdioServerTransport,
  "MCP server in C#", "MCP tool in dotnet", "expose this as MCP", or names a primitive (prompt/resource/elicitation/MCP
  App) in a .NET context. Skip for MCP work in other languages.'

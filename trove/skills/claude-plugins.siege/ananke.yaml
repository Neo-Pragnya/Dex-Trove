description: 'Work on one hard mathematics problem in rounds: each round a judge writes a few self-contained questions,
  independent workers answer them, and the judge keeps a ledger of what is proved, refuted and open, until the judge
  concludes or the rounds run out, and then a proof.md says plainly what is and is not proved. A run takes hours
  and dozens of worker runs. Usage: /math-proof:siege [NAME=value settings] <the problem, stated in full, or the
  path of a file holding it>.'

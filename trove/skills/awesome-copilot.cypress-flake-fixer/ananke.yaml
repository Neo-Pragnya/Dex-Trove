summary: Find and fix flake-prone anti-patterns in an existing Cypress suite, and APIs removed in Cypress 12 to
  16.
description: 'Find and fix flake-prone anti-patterns in an existing Cypress suite, and APIs removed in Cypress 12
  to 16. Bundles a zero-dependency scanner for fixed cy.wait() delays, assigned command return values, async/await,
  force: true, chaining after actions, one-shot expect() inside .then(), conditional testing, and removed APIs such
  as Cypress.env(), cy.exec(), cy.server()/cy.route(). Use when asked to fix flaky Cypress tests, remove cy.wait,
  stabilize or harden a Cypress suite, audit Cypress specs, debug "detached from the DOM" errors, or prepare an
  upgrade to Cypress 15 or 16.'

ananke_id: urn:dex-trove:skill:microsoft:aks-troubleshooting
summary: Debug live Azure Kubernetes Service (AKS) incidents with a read-only, evidence-first investigation.
description: 'Debug live Azure Kubernetes Service (AKS) incidents with a read-only, evidence-first investigation.
  WHEN: pod crashes or Pending, CrashLoopBackOff, OOMKilled, ImagePullBackOff, node NotReady, DNS or ingress failure,
  connectivity timeout, network policy, SNAT exhaustion, node-pool scaling blocked by QuotaExceeded or InsufficientVCPUQuota,
  upgrade stuck, spot or zone disruption, a bare VMExtensionProvisioningError or AllocationFailed wrapper, an uncataloged
  capacity symptom, or ''investigate my AKS cluster''. DO NOT USE FOR: packet capture (use aks-network-capture);
  GPU or model-serving issues (use aks-gpu-inference); cluster creation or provisioning (use azure-kubernetes);
  cost (use cost-analysis from the optional azure-cost plugin); pod rightsizing (use azure-kubernetes); a fully
  qualified documented AKS signature with every required nested qualifier (use aks-known-issues); standalone failures
  on non-AKS Azure resources (use azure-diagnostics). Unqualified errors and open-ended incidents stay here only
  for AKS.'

# Add under `jobs:` in the release workflow, after the job that uploads the dist artifact, and add
# `dist-scan` to the publish job's `needs:`. Adjust the artifact name and --extras to your project.
  dist-scan:
    name: distribution scan (what package firewalls check)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "latest"
          enable-cache: false # release job: never restore a cache that a PR could have poisoned

      - name: Install pinned scanners
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf gitleaks.tgz -C "$HOME/.local/bin" gitleaks && rm gitleaks.tgz
          uv tool install --python 3.12 guarddog==3.2.0
          uv tool install --python 3.12 pip-audit==2.10.1
          uv tool install --python 3.12 bandit==1.9.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download exact dist artifacts from build step
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-dist-${{ github.ref_name }}
          path: dist/

      - name: Scan the wheel and sdist (secrets and vulnerable dependencies block)
        run: python3 scripts/scan_dist.py --dist dist --out scan-report --require-all --extras all,mcp,dex

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-scan-${{ github.ref_name }}
          path: scan-report/
          if-no-files-found: warn

description: 'Find out why a Python package gets quarantined, flagged or blocked by package firewalls and SCA tools
  (Black Duck, JFrog Xray or Curation, Sonatype Nexus Firewall, Snyk, Mend, Socket), and fix it with free tools
  instead of a subscription. It scans the exact built or published wheel and sdist: secrets with gitleaks, vulnerable
  dependencies with pip-audit, Grype or OSV, malicious-package heuristics with GuardDog, Bandit, licence metadata,
  and an inventory of scripts, binaries and minified JS. It produces a report, applies honest fixes (remove secret-shaped
  strings, declare every bundled licence, close real code issues), and adds a blocking dist-scan job to the release
  workflow. Use whenever someone says their package was quarantined, flagged, blocked or failed a security scan,
  asks for a security scan or report without a paid tool, wants an SBOM or pre-release security gate for PyPI, or
  asks what Black Duck or a package firewall will find, even if they don''t say scan.'

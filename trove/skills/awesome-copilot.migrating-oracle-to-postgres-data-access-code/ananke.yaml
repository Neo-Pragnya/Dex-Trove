description: Migrates .NET/C# data access code from Oracle to PostgreSQL (Npgsql). Replaces Oracle NuGet packages,
  rewrites OracleConnection/OracleCommand/OracleDataReader usage, fixes DbType mappings, updates stored procedure
  invocation patterns, and adapts connection string configuration. Use when migrating the application code layer
  of a .NET project during an Oracle-to-PostgreSQL database migration.

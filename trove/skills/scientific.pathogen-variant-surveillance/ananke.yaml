description: Queries public GenSpectrum LAPIS data for pathogen genomic surveillance, current lineage nomenclature,
  weekly sequence proportions, reporting delays, and descriptive mutation frequencies. Use for variant surveillance,
  Pango lineage validation, dominant submitted lineages, Nextclade assignment provenance, SARS-CoV-2, influenza/H5N1
  clades, RSV, mpox, measles, dengue, or LAPIS queries. Distinguishes sequence prevalence from infection prevalence,
  clades from genotypes, missing calls from reference matches, and sampling changes from biological growth advantage.

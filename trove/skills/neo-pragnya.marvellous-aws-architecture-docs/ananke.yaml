  S3, DynamoDB, RAG or agent systems, data or ML pipelines). This includes requests like draw our architecture,
  make it look like AWS reference architectures, animate or number the flow, show how it is built up part by part,
  a diagram for slides, notebook, README or docs, or redoing hand-drawn or draw.io diagrams, even if they do not
  say skill or architecture as code. Also concept diagrams (cards + live flows).'

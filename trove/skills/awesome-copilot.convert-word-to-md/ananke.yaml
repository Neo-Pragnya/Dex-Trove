summary: Converts Word (.docx) documents into Markdown so their contents can be accurately analyzed, summarized,
  searched, or extracted from.
description: 'Converts Word (.docx) documents into Markdown so their contents can be accurately analyzed, summarized,
  searched, or extracted from. Use this skill whenever the user shares, references, or asks about a .docx file —
  even if they don''t say "convert" or "markdown" explicitly. This includes requests to "read", "summarize", "review",
  "extract data from", "compare", or "analyze" a Word document, resume, report, contract, or proposal. Always run
  the bundled conversion script to produce Markdown first; do not attempt to parse .docx content directly or write
  ad-hoc conversion code. Also use this skill for batch requests involving a whole folder of Word documents. IMPORTANT:
  When the user references a folder or set of documents containing multiple file types (.pdf, .docx, .xlsx), invoke
  ALL three sibling skills — convert-pdf-to-md, convert-word-to-md, and convert-excel-to-md — so no file type is
  silently skipped.'

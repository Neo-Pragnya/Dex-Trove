  morphing SVGs or effects like graphify.com, Stripe or Linear, asks for an animated hero, landing page polish,
  micro-interactions, scroll animations or a pastel redesign, or wants to upgrade Astro/MkDocs/plain-HTML docs or
  a GitHub Pages site visually, even if they don''t name a library.'

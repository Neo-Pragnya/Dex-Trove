description: Check SRT or WebVTT captions and subtitles against published standards (Netflix English, BBC subtitle
  guidelines, DCMP Captioning Key) for reading speed, line length, line count, time on screen, gaps and overlaps,
  then fix failures by retiming before rewording. Use when asked to QA, lint or validate captions, check whether
  subtitles read too fast, prepare captions for Netflix, broadcast or educational delivery, or add a caption check
  to CI.

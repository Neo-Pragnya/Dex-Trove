description: Guided statistical analysis for research data - test selection, assumption checking, effect sizes,
  power analysis, Bayesian alternatives, and APA-formatted reporting. Use whenever a user wants to compare groups,
  test a hypothesis, analyze experimental or survey data, check statistical assumptions, compute required sample
  sizes, or write up results - even if they never name a specific test. Covers t-tests, ANOVA, chi-square, correlation,
  regression, non-parametric and Bayesian methods. For low-level model APIs, see the statsmodels and pymc skills.

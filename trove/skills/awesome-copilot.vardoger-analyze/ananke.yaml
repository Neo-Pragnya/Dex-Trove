name: vardoger-analyze
version: 1.0.0
ananke_id: urn:dex-trove:skill:awesome-copilot:vardoger-analyze
summary: Use when the user asks to personalize the GitHub Copilot CLI assistant, adapt Copilot to their style, use
  vardoger, or analyze their Copilot CLI conversation history.
description: 'Use when the user asks to personalize the GitHub Copilot CLI assistant, adapt Copilot to their style,
  use vardoger, or analyze their Copilot CLI conversation history. Reads the local session directory at `~/.copilot/session-state/`,
  extracts recurring preferences and conventions, and writes a fenced personalization block into `~/.copilot/copilot-instructions.md`.
  Runs entirely on the user''s machine via the local `vardoger` CLI (`pipx install vardoger`); no network calls
  and no uploads. Triggers: ''personalize my copilot'', ''analyze my copilot history'', ''tailor copilot to me'',
  ''run vardoger'', ''update my copilot instructions from history'', ''make copilot learn my style''.'

  Playwright lab against a local or named test URL, run it on approval, read trace.zip files (failed actions, console
  and page errors, failed requests), map failing selectors and pages to the frontend source and routes, and write
  redacted evidence. Use for flaky or failing UI tests, Playwright traces, front-end errors, selectors that stopped
  matching, or browser evidence for a bug, even if they don''t say MCP.'

summary: Behaviour-level acceptance testing and a release gate for any CLI tool or Python package.
description: Behaviour-level acceptance testing and a release gate for any CLI tool or Python package. Gherkin scenarios
  (behave-style, pytest-bdd) drive the real commands in sandbox projects with isolated HOME, a capability catalog
  marks what blocks a release, and the gate decides PROMOTE / CONDITIONAL / BLOCK with evidence and CLI-surface
  coverage. It includes adversarial probes with legitimate twins, runtime-generated fake credentials, testing of
  the built wheel in a fresh venv, real-Chrome browser journeys for the project's website (Playwright-style, no
  extra dependency) and CI wiring. Use whenever someone wants to test all capabilities or features of a package
  or CLI before release, add end-to-end, acceptance, BDD, behave, Gherkin, smoke or Playwright-like tests, build
  a release or quality gate, check that what ships (the wheel) really works, find bugs the unit tests miss, or asks
  'what checks should run before we publish', even if they don't say acceptance.

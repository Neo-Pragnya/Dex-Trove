description: Generate a personal Claude Code usage & impact report ("receipts") from this machine's local session
  transcripts — for justifying Claude Code usage/spend to a manager, self-review, or "what have I been using this
  for" check-ins. Mines ~/.claude/projects locally (no extra API calls beyond one final write-up), cross-references
  local git history, and writes a markdown report plus a self-contained HTML receipt to your home directory. Use
  when the user asks for "receipts", an "impact report", "usage report", wants to "show my Claude Code activity",
  "prove the value of Claude Code", or runs `/receipts`.

description: AI-powered codebase security scanner that reasons about code like a security researcher — tracing data
  flows, understanding component interactions, and catching vulnerabilities that pattern-matching tools miss. Use
  this skill when asked to scan code for security vulnerabilities, find bugs, check for SQL injection, XSS, command
  injection, exposed API keys, hardcoded secrets, insecure dependencies, access control issues, or any request like
  "is my code secure?", "review for security issues", "audit this codebase", or "check for vulnerabilities". Covers
  injection flaws, authentication and access control bugs, secrets exposure, weak cryptography, insecure dependencies,
  and business logic issues across JavaScript, TypeScript, Python, Java, PHP, Go, Ruby, and Rust.

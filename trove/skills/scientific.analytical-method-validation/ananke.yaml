description: Plans, executes, and documents validation, verification, and transfer of analytical procedures under
  the governing framework - ICH Q2(R2) and Q14, USP <1220>/<1225>/<1226>, ICH M10 bioanalytical, CLSI EP, or ISO/IEC
  17025. Use for HPLC, LC-MS/MS, GC, CE, ICP-MS, dissolution, qNMR, qPCR, NIR, and ligand binding or cell-based
  assays whenever the question is whether a procedure is fit for its intended purpose. Triggers include "method
  validation", "analytical method validation", "AMV", "validation protocol", "acceptance criteria", "linearity",
  "reportable range", "accuracy and precision", "repeatability", "intermediate precision", "recovery", "LOD", "LOQ",
  "detection limit", "quantitation limit", "specificity", "robustness", "method transfer", "method comparison",
  "Deming", "Passing-Bablok", "Bland-Altman", "equivalence testing", "OOS investigation", "ICH Q2", "Q2(R2)", "Q14",
  "USP 1225", "ICH M10", "incurred sample reanalysis", "ISR", "CLSI EP", and any request to show that an assay works.

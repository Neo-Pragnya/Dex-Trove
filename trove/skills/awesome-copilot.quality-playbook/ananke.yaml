description: Run a complete quality engineering audit on any codebase. Derives behavioral requirements from the
  code, generates spec-traced functional tests, runs a three-pass code review with regression tests, executes a
  multi-model spec audit (Council of Three), and produces a consolidated bug report with TDD-verified patches. Finds
  the 35% of real defects that structural code review alone cannot catch. Works with any language. Trigger on 'quality
  playbook', 'spec audit', 'Council of Three', 'fitness-to-purpose', or 'coverage theater'.

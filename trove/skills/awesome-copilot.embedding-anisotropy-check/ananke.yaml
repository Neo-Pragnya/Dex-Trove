summary: Use before reporting any cosine similarity computed over embeddings or transformer hidden states, whether
  the agent computed the vectors or loaded them.
description: Use before reporting any cosine similarity computed over embeddings or transformer hidden states, whether
  the agent computed the vectors or loaded them. Measures the anisotropy of each side, centres by the population
  mean, and scores matched pairs against a permuted floor taken from the same comparison. Use when comparing one
  model's embeddings across precisions, runtimes or layers, when evaluating retrieval, probes or adapters, or before
  calling a similarity high, two conditions in agreement, or a small gap a null.

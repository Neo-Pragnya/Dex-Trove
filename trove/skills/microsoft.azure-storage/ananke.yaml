summary: Azure Storage Services including Blob Storage, File Shares, Queue Storage, Table Storage, and Data Lake.
description: 'Azure Storage Services including Blob Storage, File Shares, Queue Storage, Table Storage, and Data
  Lake. Answers questions about storage access tiers (hot, cool, cold, archive), when to use each tier, and tier
  comparison. Provides object storage, SMB file shares, async messaging, NoSQL key-value, and big data analytics.
  Includes lifecycle management. USE FOR: blob storage, file shares, queue storage, table storage, data lake, upload
  files, download blobs, storage accounts, access tiers, storage tiers, hot cool cold archive, storage tier comparison,
  when to use storage tiers, lifecycle management, Azure Storage concepts. DO NOT USE FOR: SQL databases, Cosmos
  DB (use azure-prepare), messaging with Event Hubs or Service Bus (use azure-messaging).'

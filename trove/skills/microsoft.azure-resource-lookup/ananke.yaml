description: 'List, find, and show Azure resources across subscriptions or resource groups. Handles prompts like
  "list the websites in my subscription", "list my web apps", "show my app services", "list virtual machines", "list
  my VMs", "show storage accounts", "find container apps", and "what resources do I have". USE FOR: list websites,
  list web apps, list app services, show websites in subscription, resource inventory, find resources by tag, tag
  analysis, orphaned resource discovery (not for cost analysis), unattached disks, count resources by type, cross-subscription
  lookup, and Azure Resource Graph queries. DO NOT USE FOR: deploying/changing resources (use azure-deploy), cost
  optimization (use cost-optimization from the optional azure-cost plugin), or non-Azure clouds.'

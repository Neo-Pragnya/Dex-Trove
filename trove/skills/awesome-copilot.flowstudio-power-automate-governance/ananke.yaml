description: 'Govern Power Automate flows and Power Apps at scale using the FlowStudio MCP cached store. Classify
  flows by business impact, detect orphaned resources, audit connector usage, enforce compliance standards, manage
  notification rules, and compute governance scores — all without Dataverse or the CoE Starter Kit. Load this skill
  when asked to: tag or classify flows, set business impact, assign ownership, detect orphans, audit connectors,
  check compliance, compute archive scores, manage notification rules, run a governance review, generate a compliance
  report, offboard a maker, or any task that involves writing governance metadata to flows. Requires a FlowStudio
  for Teams or MCP Pro+ subscription — see https://mcp.flowstudio.app'

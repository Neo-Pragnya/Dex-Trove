summary: Converts PDF (.pdf) documents into Markdown so their contents can be accurately analyzed, summarized, searched,
  or extracted from.
description: 'Converts PDF (.pdf) documents into Markdown so their contents can be accurately analyzed, summarized,
  searched, or extracted from. Use this skill whenever the user shares, references, or asks about a .pdf file —
  even if they don''t say "convert" or "markdown" explicitly. This includes requests to "read", "summarize", "review",
  "extract data from", "compare", or "analyze" a PDF report, paper, invoice, form, contract, or scanned document.
  Always run the bundled conversion script to produce Markdown first; do not attempt to parse PDF content directly
  or write ad-hoc extraction code. Also use this skill for batch requests involving a whole folder of PDF documents.
  IMPORTANT: When the user references a folder or set of documents containing multiple file types (.pdf, .docx,
  .xlsx), invoke ALL three sibling skills — convert-pdf-to-md, convert-word-to-md, and convert-excel-to-md — so
  no file type is silently skipped.'

name: commit-message-storyteller
version: 1.0.1
ananke_id: urn:dex-trove:skill:awesome-copilot:commit-message-storyteller
summary: Analyzes git diffs or staged changes and generates narrative commit messages that explain WHY a change
  was made, not just what changed — following Conventional Commits format.
description: Analyzes git diffs or staged changes and generates narrative commit messages that explain WHY a change
  was made, not just what changed — following Conventional Commits format. Use when asked to "write a commit message",
  "describe my changes", "what should I commit this as", or "summarize my diff". Works with git diff output, staged
  files, or plain descriptions of changes. Does not run git commit; to stage files and make the commit, use the
  git-commit skill.

description: Debug LLM applications using the Phoenix CLI. Fetch traces, analyze errors, structure trace review
  with open coding and axial coding, inspect datasets, review experiments, query annotation configs, and use the
  GraphQL API. Use whenever the user is analyzing traces or spans, investigating LLM/agent failures, deciding what
  to do after instrumenting an app, building failure taxonomies, choosing what evals to write, or asking "what's
  going wrong", "what kinds of mistakes", or "where do I focus" — even without naming a technique.

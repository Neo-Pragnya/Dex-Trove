ananke_id: urn:dex-trove:skill:awesome-copilot:incident-postmortem
summary: Use when an outage, production incident, or significant service degradation has occurred and the team needs
  to write a structured blameless post-mortem.
description: Use when an outage, production incident, or significant service degradation has occurred and the team
  needs to write a structured blameless post-mortem. Triggers on phrases like "write a post-mortem", "incident review",
  "what went wrong", "outage report", "root cause analysis", or "RCA". Covers timeline reconstruction, contributing
  factor analysis, impact quantification, and action item generation with owners.

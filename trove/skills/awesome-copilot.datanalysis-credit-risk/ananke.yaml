description: Credit risk data cleaning and variable screening pipeline for pre-loan modeling. Use when working with
  raw credit data that needs quality assessment,  missing value analysis, or variable selection before modeling.
  it covers data loading and formatting, abnormal period filtering, missing rate calculation, high-missing variable
  removal,low-IV variable filtering, high-PSI variable removal, Null Importance denoising, high-correlation variable
  removal, and cleaning report generation. Applicable scenarios arecredit risk data cleaning, variable screening,
  pre-loan modeling preprocessing.

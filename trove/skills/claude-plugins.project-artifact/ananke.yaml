description: Generate and publish a project status artifact — an opinionated, tabbed status page for a project too
  big for one update (overview & success criteria, the workstream sequence, next steps, plus background, plan, risks
  & open questions, and decisions/FAQ when they earn a tab) — published with the built-in Artifact tool to a default-private
  claude.ai page the user can share with teammates. Use when a piece of work spans several workstreams and you want
  a shareable overview kept current. Each artifact is backed by a small per-project config in the plugin data dir,
  so refreshing it re-gathers live state, redeploys the same URL, and reports only the delta. For software projects
  whose workstreams are PRs, also read swe.md (the X.Y PR-numbering convention; pulling PR state with gh/git; a
  per-PR detail block). Needs the built-in Artifact tool (claude.ai login). Not for single-PR changes or public
  docs.

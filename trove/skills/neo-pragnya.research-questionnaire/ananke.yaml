description: 'Run structured discovery research with a questionnaire people can fill in offline: generate a single
  self-contained HTML form from a question template (text, long text, choice, multi-select, number), where answers
  are saved only by an explicit download and restored by import (no browser storage, no network), then validate
  partial answers, turn them into Markdown with frontmatter and PRD source data that keeps unanswered questions
  as open questions, and merge later answer files without duplicating answers while recording where each came from.
  Use whenever someone wants a discovery questionnaire, stakeholder or requirements survey, intake form, research
  interview template, or wants questionnaire answers turned into a PRD or notes, even if they don''t say questionnaire.'

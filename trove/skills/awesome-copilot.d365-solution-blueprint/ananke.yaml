description: Authors a Dynamics 365 Finance and Supply Chain Management Solution Blueprint from scratch through
  a structured, section-by-section architect interview, establishing scope, target operating model, application
  and data architecture, integration landscape, migration strategy, security model, ALM, testing, deployment, and
  support approach, with a decision log capturing rationale and rejected alternatives. Use when the user wants to
  create D365 implementation architecture documentation, start a D365 implementation, design the architecture, prepare
  a Solution Blueprint, or identify the architectural decisions the programme must make. Do not use for critique
  of an existing design; that is a review task rather than blueprint authoring.

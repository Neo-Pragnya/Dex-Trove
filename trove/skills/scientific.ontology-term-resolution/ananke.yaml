summary: Resolves free-text scientific labels to ontology term IDs and validates existing CURIEs against the EBI
  Ontology Lookup Service (OLS4).
description: Resolves free-text scientific labels to ontology term IDs and validates existing CURIEs against the
  EBI Ontology Lookup Service (OLS4). Also looks up prefixes in Bioregistry, resolves compact identifiers via Identifiers.org,
  maps lab shorthand with ZOOMA, and builds Ontobee term pages. Use whenever an ontology identifier must be produced
  or checked - annotating tissue, cell type, disease, phenotype, assay, chemical, organism, sex, or developmental
  stage fields; preparing metadata for GEO, ENA, BioSamples, CELLxGENE, HCA, or ISA-Tab submission; auditing a metadata
  table of term IDs; checking whether a term is obsolete and what replaced it; or deciding HPO vs HP. Triggers include
  "ontology term", "ontology ID", "CURIE", "controlled vocabulary", "UBERON", "CL:", "MONDO", "HPO", "EFO", "ChEBI",
  "NCBITaxon", "GO term", "PATO", "Zooma", "Bioregistry", "Identifiers.org", "Ontobee", "annotate this tissue/cell
  type/disease", and any request to emit or verify an identifier shaped like PREFIX:0001234.

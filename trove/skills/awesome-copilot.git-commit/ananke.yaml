name: git-commit
version: 1.0.1
ananke_id: urn:dex-trove:skill:awesome-copilot:git-commit
summary: Use this skill when the user wants to make a Git commit or split changes into more than one commit. Also
  use it when the user types "/commit" or asks for a conventional commit.
description: Use this skill when the user wants to make a Git commit or split changes into more than one commit.
  Also use it when the user types "/commit" or asks for a conventional commit. The skill examines the diff, stages
  the related files, writes a Conventional Commits message, and runs git commit. Do not use it when the user wants
  only a commit message and no commit. Do not use it to push, open a pull request, rebase, or change the commit
  history.

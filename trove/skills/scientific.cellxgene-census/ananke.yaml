description: Queries the CZ CELLxGENE Census programmatically for versioned public single-cell and spatial transcriptomics
  data. Use when you need population-scale cell metadata, gene expression slices, Census summary counts, source
  H5AD URIs/downloads, embeddings, spatial Census data, or reference atlas comparisons across organisms, tissues,
  diseases, assays, and cell types. For analyzing your own local single-cell data use scanpy, anndata, or scvi-tools.

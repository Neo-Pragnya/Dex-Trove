description: Looks up precomputed AlphaGenome Atlas effects for any GRCh38 single-nucleotide variant (AVI score
  with Phred and 18 SHAP feature attributions, plus raw and quantile scores for RNA-seq, DNase, ATAC, ChIP-TF, ChIP-histone,
  CAGE, PRO-cap, splicing, polyadenylation and contact-map tracks), scores variants or scans windows on demand with
  the AlphaGenome model for human and mouse (variant scoring, in silico mutagenesis, REF-versus-ALT track prediction),
  and builds Atlas website deep links. Use when the user mentions AlphaGenome, AlphaGenome Atlas, AVI or AlphaGenome
  Variant Impact, DeepMind variant effect prediction, or wants to prioritise or mechanistically interpret non-coding,
  regulatory, splicing, enhancer, promoter, or chromatin-accessibility effects of SNVs from a VCF, credible set,
  or region. Research use only; not a clinical tool.

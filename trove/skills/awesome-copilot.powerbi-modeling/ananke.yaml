description: Power BI semantic modeling assistant for building optimized data models. Use when working with Power
  BI semantic models, creating measures, designing star schemas, configuring relationships, implementing RLS, or
  optimizing model performance. Triggers on queries about DAX calculations, table relationships, dimension/fact
  table design, naming conventions, model documentation, cardinality, cross-filter direction, calculation groups,
  and data model best practices. Always connects to the active model first using power-bi-modeling MCP tools to
  understand the data structure before providing guidance.

description: 'Use this skill when adding, modifying, or reviewing CLI commands in a .NET project built with System.CommandLine.
  Triggers include: creating a new CLI command, adding options or arguments, wiring command handlers, registering
  subcommands, building command groups, or any architecture decision about CLI command structure. Also use when
  the user mentions ''System.CommandLine'', ''CommandBase'', ''SetAction'', ''ParseResult'', ''RootCommand'', ''subcommand'',
  or asks to add a verb to the CLI. Do NOT use for general C# coding, web APIs, UI work, or non-CLI projects.'

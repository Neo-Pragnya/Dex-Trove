description: 'Life Ikigai Architect: turn a person''s reflections, journals, notes or purpose conversations into
  a personal Ikigai, vision, mission, values and roadmap, delivered as one self-explanatory, animated HTML presentation
  (interactive four-circle Ikigai Venn, six-dimension petals, archetype triad, vision-to-values cascade, five-function
  wheel, ecosystem with live flows, scoring heatmap, roadmaps with a moving comet, reflection prompts). Use whenever
  someone wants to find or articulate their Ikigai, life purpose, personal mission or vision statement, calling
  or vocation, dharma, life design or life architecture, a personal strategy or 90-day plan that ties meaning to
  money, or to choose between career paths or ventures by purpose. Also when they share a purpose or career conversation,
  a journal, or an Ikigai note and ask to make it visual, a deck, a vision board or presentation, or a skill for
  others to do the same, even if they don''t say Ikigai.'

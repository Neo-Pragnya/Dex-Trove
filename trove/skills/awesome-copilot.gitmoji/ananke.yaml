kind: skill
namespace: awesome-copilot
name: gitmoji
version: 1.0.0
ananke_id: urn:dex-trove:skill:awesome-copilot:gitmoji
summary: Generates commit messages following the gitmoji convention (https://gitmoji.dev) — picks the right emoji
  for the intent of the change and writes a well-formed message.
description: Generates commit messages following the gitmoji convention (https://gitmoji.dev) — picks the right
  emoji for the intent of the change and writes a well-formed message. Use when asked to "write a gitmoji commit",
  "add an emoji to my commit message", "which gitmoji should I use", "gitmoji this change", or when a project uses
  gitmoji-style commit messages. Works from a git diff, staged changes, or a plain description of the change. Generates
  the message only — does not run git commands.

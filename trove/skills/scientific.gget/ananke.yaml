description: Queries 20+ bioinformatics resources through CLI/Python. Supports quick lookups of gene info, BLAST/BLAT,
  viral sequence downloads, PDB/mmCIF structures, G2P residue annotations, enrichment analysis, OpenTargets, COSMIC,
  CELLxGENE, and 8cube mouse specificity/expression data. Best for interactive exploration and simple queries. For
  batch processing or advanced BLAST use biopython; for multi-database Python workflows use bioservices.

description: Mistake-proof code so misuse cannot be expressed, rather than warning against it. Use when designing
  an interface, schema, or state machine and the user wants it hard to get wrong ("make invalid states unrepresentable",
  "so callers cannot screw it up", "type-safe API", "pit of success"); when auditing existing code for footguns
  ("what could bite us here", "what is easy to misuse", "poka-yoke this repo", "review this diff for ways to get
  it wrong"); or when a bug has recurred and the fix must close the class rather than the case ("make sure this
  never happens again", "this is the third time"). Especially for money, auth, permissions, deletion, migrations,
  and pipelines where failure is silent. Classifies every finding by what happens when the mistake occurs and how
  the device notices, which is what keeps it from collapsing into generic code review.

summary: Performs RNA velocity analysis with scVelo from spliced and unspliced single-cell RNA counts.
description: Performs RNA velocity analysis with scVelo from spliced and unspliced single-cell RNA counts. Fits
  deterministic or dynamical models, examines gene phase portraits, builds velocity graphs, estimates relative latent
  time, and ranks velocity-associated genes. Use for directional trajectory hypotheses and kinetic-model diagnostics
  alongside Scanpy; velocity alone does not establish cell fate or causal drivers.

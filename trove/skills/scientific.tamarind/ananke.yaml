description: Provides access to a collection of open-source molecular design and structural biology tools on the
  Tamarind Bio platform, via its REST API or MCP server — no local GPUs required. Tamarind bundles popular open-source
  models for structure prediction (AlphaFold, Boltz, Chai, ESMFold), protein, binder, and de novo design (RFdiffusion,
  ProteinMPNN, BoltzGen), antibody and nanobody design and developability, protein-ligand docking (DiffDock, Autodock
  Vina), binding-affinity prediction, MSA generation, and molecular dynamics. Use when the user mentions Tamarind
  or tamarind.bio, wants to run any of these open-source tools in the cloud, references app.tamarind.bio/api or
  the x-api-key header, or needs to submit batches of sequences for structural or biophysical characterization.

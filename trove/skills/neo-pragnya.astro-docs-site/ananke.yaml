description: 'Set up (or migrate to) a modern Astro documentation website for a repository, deployed to GitHub Pages:
  docs read straight from the repo''s docs/ folder (one source of truth for GitHub and the site), sidebar + on-page
  TOC + prev/next + edit-on-GitHub, Mermaid diagrams, GitHub alerts and MkDocs admonitions, .md links rewritten
  to routes, sanitised Markdown, a pastel interactive landing page (morphing SVG glyphs, cursor-reactive shape field,
  reveals, count-up stats), light/dark toggle, 404, link checker, Pages workflow and screenshot verification. Use
  whenever someone wants docs for a repo, a GitHub Pages site, a project website or landing page, to move off MkDocs/Docusaurus/Jekyll,
  to ''make the docs look modern'', or to give a new repo ''all the elements'' of a docs setup, even if they don''t
  say Astro.'

  reveals, pinned sections, horizontal scroll, text animations, or any motion tied to scroll position — in vanilla
  JS, React, or Next.js. Covers GSAP ScrollTrigger (pinning, scrubbing, snapping, timelines, horizontal scroll,
  ScrollSmoother, matchMedia) and Framer Motion / Motion v12 (useScroll, useTransform, useSpring, whileInView, variants).
  Use this skill even if the user just says "animate on scroll", "fade in as I scroll", "make it scroll like Apple",
  "parallax effect", "sticky section", "scroll progress bar", or "entrance animation". Also triggers for Copilot
  prompt patterns for GSAP or Framer Motion code generation. Pairs with the premium-frontend-ui skill for creative
  philosophy and design-level polish.

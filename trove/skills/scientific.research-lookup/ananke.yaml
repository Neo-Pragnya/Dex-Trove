description: Compiles current scholarly evidence for a scientific manuscript or research brief when the user explicitly
  asks to gather literature, references, background evidence, competing findings, or a manuscript research packet.
  Uses Parallel Search by default, Parallel Extract for source retrieval, Parallel Research for explicitly deep/exhaustive
  work, optional explicit Parallel Chat, and optional Perplexity only when requested or allowed as a failure fallback.

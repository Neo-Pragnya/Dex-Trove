name: lean-comments
version: 1.0.0
ananke_id: urn:dex-trove:skill:awesome-copilot:lean-comments
summary: Audits, writes, and refines maintained first-party source-code comments and declaration-level documentation
  across languages.
description: Audits, writes, and refines maintained first-party source-code comments and declaration-level documentation
  across languages. Use when adding, editing, reviewing, cleaning up, or auditing comments, doc comments, docstrings,
  TODO, FIXME, NOTE, suppressions, or other source commentary, including while modifying code and deciding whether
  a comment is warranted at all. Defaults to no comment unless it preserves meaningful, non-obvious information
  that cannot reasonably be recovered from the code or nearby repository context.

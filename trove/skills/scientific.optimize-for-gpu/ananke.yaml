summary: GPU-accelerates scientific Python on NVIDIA hardware and verifies that the result is correct and faster.
description: GPU-accelerates scientific Python on NVIDIA hardware and verifies that the result is correct and faster.
  Use for CUDA/GPU optimization; CPU-bound NumPy, SciPy, pandas, scikit-learn, NetworkX, scikit-image, vector-search,
  image-processing, graph, simulation, or file-I/O workloads; CuPy, cuDF, cuML, cuGraph, cuVS, cuCIM, KvikIO, Warp,
  Newton, Numba-CUDA, or RAFT questions; and profiling, memory-transfer, kernel, or multi-GPU bottlenecks. Also
  use when large data-parallel Python code is slow and GPU acceleration is a plausible option, even if the user
  does not name CUDA.

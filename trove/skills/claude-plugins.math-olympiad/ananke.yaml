description: Solve competition math problems (IMO, Putnam, USAMO, AIME) with adversarial verification that catches
  the errors self-verification misses. Activates when asked to 'solve this IMO problem', 'prove this olympiad inequality',
  'verify this competition proof', 'find a counterexample', 'is this proof correct', or for any problem with 'IMO',
  'Putnam', 'USAMO', 'olympiad', or 'competition math' in it. Uses pure reasoning (no tools) — then a fresh-context
  adversarial verifier attacks the proof using specific failure patterns, not generic 'check logic'. Outputs calibrated
  confidence — will say 'no confident solution' rather than bluff. If LaTeX is available, produces a clean PDF after
  verification passes.

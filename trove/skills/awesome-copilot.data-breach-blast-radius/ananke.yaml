description: 'Pre-breach impact analysis: inventories sensitive data (PII, PHI, PCI-DSS, credentials), traces data
  flows, scores exposure vectors, and produces a regulatory blast radius report with fine ranges sourced verbatim
  from GDPR Art. 83, CCPA § 1798.155(a), and HIPAA 45 CFR § 160.404. Cost benchmarks from IBM Cost of a Data Breach
  Report (annually updated). All citations in references/SOURCES.md for verification. Use when asked: "assess breach
  impact", "what data could be exposed", "calculate blast radius", "data exposure analysis", "how bad would a breach
  be", "quantify data risk", "sensitive data inventory", "data flow security audit", "pre-breach assessment", "worst-case
  breach scenario", "breach readiness", "data risk report", "/data-breach-blast-radius". For any stack handling
  user data, health records, or financial information. Output labels law-sourced figures (exact) vs heuristic estimates
  (planning only). Does not replace legal counsel.'

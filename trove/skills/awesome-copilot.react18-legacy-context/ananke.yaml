description: Provides the complete migration pattern for React legacy context API (contextTypes, childContextTypes,
  getChildContext) to the modern createContext API. Use this skill whenever migrating legacy context in class components
  - this is always a cross-file migration requiring the provider AND all consumers to be updated together. Use it
  before touching any contextTypes or childContextTypes code, because migrating only the provider without the consumers
  (or vice versa) will cause a runtime failure. Always read this skill before writing any context migration - the
  cross-file coordination steps here prevent the most common context migration bugs.

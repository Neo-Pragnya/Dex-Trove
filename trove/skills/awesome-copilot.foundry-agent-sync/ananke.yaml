summary: Create and synchronize prompt-based AI agents directly within Azure AI Foundry via REST API, from a local
  JSON manifest.
description: 'Create and synchronize prompt-based AI agents directly within Azure AI Foundry via REST API, from
  a local JSON manifest. Unlike scaffolding skills that only generate local code, this skill registers agents in
  the Foundry service itself — making them immediately available for invocation. Use when the user asks to create
  agents in Foundry, sync, deploy, register, or push agents to Foundry, update agent instructions, or scaffold the
  manifest and sync script for a new repository. Triggers: ''create agent in foundry'', ''sync foundry agents'',
  ''deploy agents to foundry'', ''register agents in foundry'', ''push agents'', ''create foundry agent manifest'',
  ''scaffold agent sync''.'

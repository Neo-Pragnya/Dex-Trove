summary: Hugging Face Hub CLI (`hf`) for downloading, uploading, and managing models, datasets, spaces, buckets,
  repos, papers, jobs, and more on the Hugging Face Hub.
description: 'Hugging Face Hub CLI (`hf`) for downloading, uploading, and managing models, datasets, spaces, buckets,
  repos, papers, jobs, and more on the Hugging Face Hub. Use when: handling authentication; managing local cache;
  managing Hugging Face Buckets; running or scheduling jobs on Hugging Face infrastructure; managing Hugging Face
  repos; discussions and pull requests; browsing models, datasets and spaces; reading, searching, or browsing academic
  papers; managing collections; querying datasets; configuring spaces; setting up webhooks; or deploying and managing
  HF Inference Endpoints. Make sure to use this skill whenever the user mentions ''hf'', ''huggingface'', ''Hugging
  Face'', ''huggingface-cli'', or ''hugging face cli'', or wants to do anything related to the Hugging Face ecosystem
  and to AI and ML in general. Also use for cloud storage needs like training checkpoints, data pipelines, or agent
  traces. Use even if the user doesn''t explicitly ask for a CLI command. Replaces the deprecated `huggingface-cli`.'

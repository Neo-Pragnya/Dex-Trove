description: 'Plan, deploy, operate, and troubleshoot multi-rack (rack scale) deployments of Azure Local — preintegrated
  racks scaling to hundreds of machines, built on Network Fabric Controller, Cluster Manager, SAN storage, and managed
  network fabric. Use for the Microsoft.NetworkCloud and Microsoft.ManagedNetworkFabric control plane. NOT for standard
  1-16 node Azure Local, and NOT for rack-aware clusters (two racks as availability zones, up to 8 nodes, synchronous
  replication) — those are standard scale. WHEN: multi-rack, rack scale Azure Local, aggregation rack, compute rack,
  Network Fabric Controller, NFC, Cluster Manager, network fabric, isolation domain, az networkcloud, az networkfabric,
  multi-rack logical network, multi-rack Arc VM.'

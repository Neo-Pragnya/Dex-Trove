kind: bundle
namespace: awesome-copilot
name: visual-pr
version: 1.0.0
ananke_id: urn:dex-trove:plugin:awesome-copilot:visual-pr
summary: Capture, annotate, and embed screenshots and animated GIF demos in pull request descriptions.
description: Capture, annotate, and embed screenshots and animated GIF demos in pull request descriptions. Includes
  Playwright-based UI capture, PIL image annotations, PR embedding workflows for GitHub and Azure DevOps, and screen
  recording with variable timing.
runtime:
  supported:
  - claude-code
  - github-copilot
  - generic
permissions:
  filesystem:
    read: []
    write: []
  shell:
    allow: []
  network: []
members:
- ref: ananke://skill/awesome-copilot/image-annotations
  version: '*'
- ref: ananke://skill/awesome-copilot/pr-screenshots
  version: '*'
- ref: ananke://skill/awesome-copilot/screen-recording
  version: '*'
- ref: ananke://skill/awesome-copilot/ui-screenshots
  version: '*'
license:
  expression: MIT
  source: 'frontmatter license: ''MIT'''
  approval: approved
metadata:
  tags:
  - annotations
  - awesome-copilot
  - before-after
  - gif
  - playwright
  - plugin
  - pull-request
  - screen-recording
  - screenshots
  - visual
  homepage: https://github.com/github/awesome-copilot/tree/613efc8c21d9b3ce642dff361d17006cd9967e28/plugins/visual-pr
  repository: https://github.com/github/awesome-copilot

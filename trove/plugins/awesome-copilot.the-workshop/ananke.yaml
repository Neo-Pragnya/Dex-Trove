kind: bundle
namespace: awesome-copilot
name: the-workshop
version: 0.1.1
ananke_id: urn:dex-trove:plugin:awesome-copilot:the-workshop
summary: Stop being the switchboard between your AI agents — direct a team. The Workshop puts long-running AI agents
  (desks) in the same room, on the same work, each with its own memory and history, sharing on…
description: Stop being the switchboard between your AI agents — direct a team. The Workshop puts long-running AI
  agents (desks) in the same room, on the same work, each with its own memory and history, sharing one workspace
  so you direct the work instead of relaying it.
runtime:
  supported:
  - claude-code
  - github-copilot
  - generic
permissions:
  filesystem:
    read: []
    write: []
  shell:
    allow: []
  network: []
members:
- ref: ananke://skill/awesome-copilot/bench-read
  version: '*'
- ref: ananke://skill/awesome-copilot/desk-journal
  version: '*'
- ref: ananke://skill/awesome-copilot/desk-open
  version: '*'
- ref: ananke://skill/awesome-copilot/signal-write
  version: '*'
- ref: ananke://skill/awesome-copilot/workshop-create
  version: '*'
- ref: ananke://agent/awesome-copilot/workshop-ta
  version: '*'
license:
  expression: MIT
  source: 'frontmatter license: ''MIT'''
  approval: approved
metadata:
  tags:
  - agent-signals
  - awesome-copilot
  - coordination
  - desks
  - developer-experience
  - multi-agent
  - persistent-memory
  - plugin
  homepage: https://github.com/github/awesome-copilot/tree/61fa1fa8fcc63d6dbd2f07a75aeb8e214df5acfb/plugins/the-workshop
  repository: https://github.com/github/awesome-copilot

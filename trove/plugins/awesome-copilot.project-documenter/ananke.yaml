kind: bundle
namespace: awesome-copilot
name: project-documenter
version: 1.0.0
ananke_id: urn:dex-trove:plugin:awesome-copilot:project-documenter
summary: Generate professional project documentation with draw.io architecture diagrams and Word (.docx) output

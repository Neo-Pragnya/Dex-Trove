  version: '*'
- ref: ananke://skill/awesome-copilot/md-to-docx
  version: '*'
- ref: ananke://agent/awesome-copilot/project-documenter
  version: '*'
license:
  expression: MIT
  source: 'frontmatter license: ''MIT'''
  approval: approved
metadata:
  tags:
  - architecture-diagrams
  - auto-discovery
  - awesome-copilot
  - c4-model
  - documentation
  - docx
  - drawio
  - plugin
  - png-images
  - project-summary
  - word-document
  homepage: https://github.com/github/awesome-copilot/tree/b1a00457c0b8794243883f387e7de71e88800e3e/plugins/project-documenter

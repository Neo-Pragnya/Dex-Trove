kind: bundle
namespace: awesome-copilot
name: acreadiness-cockpit
version: 1.0.0
ananke_id: urn:dex-trove:plugin:awesome-copilot:acreadiness-cockpit
summary: 'Drive Microsoft AgentRC from Copilot chat: assess AI readiness, generate Copilot instructions (flat or
  nested with applyTo globs for monorepos), and manage policies.'
description: 'Drive Microsoft AgentRC from Copilot chat: assess AI readiness, generate Copilot instructions (flat
  or nested with applyTo globs for monorepos), and manage policies. Produces a self-contained static HTML dashboard
  at reports/index.html.'
runtime:
  supported:
  - claude-code
  - github-copilot
  - generic
permissions:
  filesystem:
    read: []
    write: []
  shell:
    allow: []
  network: []
members:
- ref: ananke://skill/awesome-copilot/acreadiness-assess
  version: '*'
- ref: ananke://skill/awesome-copilot/acreadiness-generate-instructions
  version: '*'
- ref: ananke://skill/awesome-copilot/acreadiness-policy
  version: '*'
- ref: ananke://agent/awesome-copilot/ai-readiness-reporter
  version: '*'
license:
  expression: MIT
  source: 'frontmatter license: ''MIT'''
  approval: approved
metadata:
  tags:
  - agentrc
  - ai-readiness
  - awesome-copilot
  - copilot-instructions
  - dashboard
  - monorepo
  - plugin
  - policy
  - readiness-report
  homepage: https://github.com/github/awesome-copilot/tree/b1a00457c0b8794243883f387e7de71e88800e3e/plugins/acreadiness-cockpit
  repository: https://github.com/github/awesome-copilot

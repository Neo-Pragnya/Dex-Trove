# Findings a person has reviewed, read by scripts/scan_dist.py at every release. Each needs a reason, and each file is
# named: the same rule matching any other file blocks the release. The trove is other people's documentation, shown to
# a person; Dex runs none of it.

[[bundled]]
path = "*/skills/impeccable.impeccable/scripts/modern-screenshot.umd.js"
licence = "MIT"
reason = "modern-screenshot 4.x (MIT, wxm), which Impeccable bundles for screenshots; its licence ships beside it as modern-screenshot.LICENSE"

[[bundled]]
path = "*/skills/impeccable.impeccable/scripts/live-browser.js"
licence = "Apache-2.0"
reason = "Impeccable's own readable script (Apache-2.0), large rather than minified"


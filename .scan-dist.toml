[heuristics]
capability-filesystem-delete = "Dex removes only what it wrote (candidates.py); vendored scripts and tests clean up their own temporary files"
capability-filesystem-read = "Dex reads the trove and licence files it ships; vendored scripts read the files a person points them at"
capability-filesystem-write-executable = "vendored scripts and tests write files they generate, such as diagrams and test fixtures"
capability-network-download = "dex cli.py fetches a source the user names; vendored skills call the APIs they document"
capability-network-lolbas = "scientific.paper-lookup calls the OpenAlex API it documents"
capability-network-outbound = "candidates.py asks a configured source; vendored skills and tests call the APIs they document"
capability-process-schedule = "Impeccable live-browser.js uses timers in the page it is injected into"
capability-process-spawn = "ananke_bridge.py runs the ananke CLI with a list of arguments; vendored scripts run the tools they document"

[heuristics.threat-process-download-exec]
reason = "awesome-copilot eyeball prints 'pip install ...' hints for missing optional packages; it installs nothing"
paths = ["dex_trove/skills/awesome-copilot.eyeball/tools/eyeball.py", "trove/skills/awesome-copilot.eyeball/tools/eyeball.py"]

[heuristics.threat-runtime-obfuscation]
reason = "awesome-copilot azure-architecture-autopilot keeps Azure's official icons as base64 SVG in one 2.1 MB file, decoded only to draw a diagram"
paths = ["dex_trove/skills/awesome-copilot.azure-architecture-autopilot/scripts/icons.py", "trove/skills/awesome-copilot.azure-architecture-autopilot/scripts/icons.py"]

[heuristics.threat-setup-network-in-install]
reason = "BMad's runtime setup script, which is named setup.py but isn't a package installer: run by a person, it reads a bmod file over HTTPS"
paths = ["dex_trove/skills/patched.bmad/scripts/setup.py", "trove/skills/patched.bmad/scripts/setup.py"]

[heuristics.threat-setup-suspicious-imports]
reason = "the same BMad runtime script: urllib for that HTTPS read"
paths = ["dex_trove/skills/patched.bmad/scripts/setup.py", "trove/skills/patched.bmad/scripts/setup.py"]

[heuristics.threat-process-spawn-silent]
reason = "awesome-copilot pr-dashboard opens its report in the browser (open, xdg-open or start), detached"
paths = ["dex_trove/skills/awesome-copilot.pr-dashboard/scripts/pr-dashboard-cli.mjs", "trove/skills/awesome-copilot.pr-dashboard/scripts/pr-dashboard-cli.mjs"]

[heuristics.threat-runtime-environment-read]
reason = "Hugging Face evaluation scripts read HF_TOKEN to reach the Hub, as documented"
paths = ["dex_trove/skills/huggingface.huggingface-community-evals/scripts/*.py", "trove/skills/huggingface.huggingface-community-evals/scripts/*.py", "dex_trove/skills/huggingface.huggingface-llm-trainer/scripts/*.py", "trove/skills/huggingface.huggingface-llm-trainer/scripts/*.py", "dex_trove/skills/huggingface.*/scripts/*.py", "trove/skills/huggingface.*/scripts/*.py"]

[heuristics.threat-filesystem-read]
reason = "tests and audit scripts reading files they were pointed at: Dex's own tests, docs drift audit, harvesting and BMad eval tests"
paths = ["tests/*", "dex_trove/skills/awesome-copilot.docs-sync-audit/scripts/docs_drift.py", "trove/skills/awesome-copilot.docs-sync-audit/scripts/docs_drift.py", "dex_trove/skills/bmad-method.bmad-eval/scripts/tests/*", "trove/skills/bmad-method.bmad-eval/scripts/tests/*", "dex_trove/skills/neo-pragnya.scaffold-harvesting/scripts/harvest.py", "trove/skills/neo-pragnya.scaffold-harvesting/scripts/harvest.py", "forks/bmad/scripts/tests/*"]

# Components bundled inside trove items whose licences the item's own licence file doesn't carry. `dex notices`
# writes each into THIRD_PARTY_NOTICES.md with its full text, so the notice ships even if the item is learned again.

[[component]]
name = "modern-screenshot"
item = "impeccable/impeccable"
path = "trove/skills/impeccable.impeccable/scripts/modern-screenshot.umd.js"
licence = "MIT"
copyright = "Copyright (c) 2021-present wxm"
url = "https://github.com/qq15725/modern-screenshot"
text = "notices/modern-screenshot.LICENSE"

name: Item feedback
description: Report a problem with an item (doesn't load, wrong licence, misleading description, unsafe script).
title: "Item: "
labels: [item-feedback]
body:
  - type: markdown
    attributes:
      value: |
        Feedback is public and tied to your GitHub account; maintainers moderate it under the
        [Code of Conduct](https://github.com/Neo-Pragnya/Dex-Trove/blob/main/CODE_OF_CONDUCT.md).
        For a security issue, use private reporting in SECURITY.md instead.
  - type: input
    id: item
    attributes:
      label: Item
      description: "kind:namespace/name"
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: Problem
      options:
        - Doesn't load or install
        - Licence looks wrong
        - Description or facets are misleading
        - Script looks unsafe
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you ran, what happened, and the dex version (`dex --version`).
    validations:
      required: true

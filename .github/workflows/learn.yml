name: learn

# Weekly: re-learn every enabled source and open a PR with the trove diff for human review.
# First-party skills (`local:` only) are skipped here; re-learn them locally with `dex learn neo-pragnya`.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learn:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "latest"

      - name: Learn and validate
        run: |
          uv sync --all-extras
          uv run dex learn | tee learn-summary.txt
          uv run dex validate

      - name: Open pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: bot/learn
          delete-branch: true
          commit-message: "trove: weekly learn"
          title: "trove: weekly learn"
          body-path: learn-summary.txt
          add-paths: |
            trove/**
            THIRD_PARTY_NOTICES.md
          labels: learn, needs-review
